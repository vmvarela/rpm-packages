name: Update RPM Repository

on:
  repository_dispatch:
    types: [update-sql-pipe, update-ghoten]
  workflow_dispatch:
    inputs:
      package:
        description: "Package whose release triggered the rebuild"
        required: true
        default: sql-pipe
        type: choice
        options:
          - sql-pipe
          - ghoten
      version:
        description: "Release version without v; leave empty to use latest stable"
        required: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy RPM repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c gnupg

      - name: Resolve package versions
        id: vars
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          set -euo pipefail
          latest_version() {
            curl --fail --silent --show-error \
              "https://api.github.com/repos/vmvarela/$1/releases/latest" |
              jq -r '.tag_name' |
              sed 's/^v//'
          }
          case "${EVENT_ACTION:-${INPUT_PACKAGE:-}}" in
            update-sql-pipe|sql-pipe) target="sql-pipe" ;;
            update-ghoten|ghoten) target="ghoten" ;;
            *) echo "::error::Unknown package update event."; exit 1 ;;
          esac
          sql_pipe_version="$(latest_version sql-pipe)"
          ghoten_version="$(latest_version ghoten)"
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            requested="${REQUESTED_VERSION#v}"
            if [[ "$target" == "sql-pipe" ]]; then sql_pipe_version="$requested"; else ghoten_version="$requested"; fi
          fi
          for value in "$sql_pipe_version" "$ghoten_version"; do
            if [[ ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid stable release version: $value"
              exit 1
            fi
          done

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "sql_pipe_version=$sql_pipe_version" >> "$GITHUB_OUTPUT"
          echo "ghoten_version=$ghoten_version" >> "$GITHUB_OUTPUT"
          echo "Rebuilding RPM repository: sql-pipe=$sql_pipe_version, ghoten=$ghoten_version"

      - name: Download .rpm packages
        shell: bash
        env:
          TARGET: ${{ steps.vars.outputs.target }}
          SQL_PIPE_VERSION: ${{ steps.vars.outputs.sql_pipe_version }}
          GHOTEN_VERSION: ${{ steps.vars.outputs.ghoten_version }}
        run: |
          set -euo pipefail
          mkdir -p site/packages/x86_64 site/packages/aarch64

          for arch in x86_64 aarch64; do
            file="sql-pipe-${SQL_PIPE_VERSION}-1.${arch}.rpm"
            curl --fail --silent --show-error --location \
              "https://github.com/vmvarela/sql-pipe/releases/download/v${SQL_PIPE_VERSION}/${file}" \
              -o "site/packages/${arch}/${file}"
          done

          ghoten_count=0
          for arch in x86_64 aarch64; do
            file="ghoten-${GHOTEN_VERSION}-1.${arch}.rpm"
            if curl --fail --silent --show-error --location \
              "https://github.com/vmvarela/ghoten/releases/download/v${GHOTEN_VERSION}/${file}" \
              -o "site/packages/${arch}/${file}"; then
              ghoten_count=$((ghoten_count + 1))
            else
              rm -f "site/packages/${arch}/${file}"
              echo "Ghoten native package not available yet: ${file}"
            fi
          done

          if [[ "$TARGET" == "ghoten" && "$ghoten_count" -ne 2 ]]; then
            echo "::error::A Ghoten-triggered rebuild requires both Ghoten RPM packages."
            exit 1
          fi
          find site/packages -type f -print | sort

      - name: Generate RPM repository metadata
        run: |
          for ARCH in x86_64 aarch64; do
            if ls site/packages/${ARCH}/*.rpm 2>/dev/null; then
              createrepo_c site/packages/${ARCH}/
            fi
          done

      - name: Sign repomd.xml
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "${GPG_SIGNING_KEY}" ]; then
            echo "::warning::GPG_SIGNING_KEY not set — repository will be unsigned"
            exit 0
          fi
          echo "${GPG_SIGNING_KEY}" | gpg --batch --import
          gpg --armor --export "${GPG_KEY_ID}" > site/RPM-GPG-KEY-vmvarela
          for ARCH in x86_64 aarch64; do
            REPOMD="site/packages/${ARCH}/repodata/repomd.xml"
            if [ -f "${REPOMD}" ]; then
              gpg --batch --yes --pinentry-mode loopback \
                --default-key "${GPG_KEY_ID}" \
                --detach-sign --armor \
                -o "${REPOMD}.asc" "${REPOMD}"
            fi
          done

      - name: Generate .repo config file
        run: |
          cat > site/vmvarela.repo << 'REPO'
          [vmvarela]
          name=vmvarela tools
          baseurl=https://vmvarela.github.io/rpm-packages/packages/$basearch
          gpgcheck=0
          repo_gpgcheck=1
          gpgkey=https://vmvarela.github.io/rpm-packages/RPM-GPG-KEY-vmvarela
          enabled=1
          REPO

      - name: Create index page
        run: |
          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>vmvarela RPM repository</title></head>
          <body>
          <h1>vmvarela RPM repository</h1>
          <h2>Installation</h2>
          <pre>
          sudo curl -fsSL https://vmvarela.github.io/rpm-packages/vmvarela.repo \
            -o /etc/yum.repos.d/vmvarela.repo
          sudo dnf install sql-pipe
          sudo dnf install ghoten
          </pre>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
